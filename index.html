<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisaPilot - 您的随身签证官</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============================== LOGIN PAGE ============================== -->
<div class="login-page" id="loginPage">
  <div class="login-left">
    <div class="login-hero">
      <div class="logo-icon">VP</div>
      <h1>VisaPilot</h1>
      <p class="subtitle">您的随身签证官 — 智能签证申请一站式平台</p>
      <div class="features">
        <div class="feature-item"><span class="dot"></span>覆盖全球30+国家签证信息</div>
        <div class="feature-item"><span class="dot"></span>智能材料清单 + DIY自助上传</div>
        <div class="feature-item"><span class="dot"></span>在线预约面签 · 人工代办服务</div>
        <div class="feature-item"><span class="dot"></span>行程规划 · 保险购买 · 文件翻译</div>
      </div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="login-subtitle">登录您的VisaPilot账户</p>
      <div class="role-selector" id="roleSelector">
        <button class="role-btn active" data-role="user">用户</button>
        <button class="role-btn" data-role="officer">签证官</button>
        <button class="role-btn" data-role="admin">后台管理</button>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">邮箱 / 用户名</label>
          <input class="form-input" type="text" id="loginEmail" placeholder="请输入您的邮箱或用户名" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" type="password" id="loginPassword" placeholder="请输入密码" required>
        </div>
        <p class="form-hint" id="loginHint" style="color:var(--danger);display:none;">账号或密码错误</p>
        <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>
      </form>
      <div class="login-divider">或</div>
      <button class="btn btn-secondary btn-block" id="showRegisterForm">注册新账号</button>
      <p class="login-footer-text">注册即表示同意 <a>服务条款</a> 和 <a>隐私政策</a></p>
      
      <!-- Registration form (hidden by default) -->
      <form id="registerForm" style="display:none; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input class="form-input" type="text" id="regName" placeholder="请输入真实姓名">
        </div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" type="email" id="regEmail" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input class="form-input" type="tel" id="regPhone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
          <label class="form-label">微信号</label>
          <input class="form-input" type="text" id="regWechat" placeholder="请输入微信号">
        </div>
        <div class="form-group">
          <label class="form-label">设置密码</label>
          <input class="form-input" type="password" id="regPassword" placeholder="请设置密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">注册</button>
        <p class="login-footer-text" style="margin-top:8px;"><a id="backToLogin">已有账号？返回登录</a></p>
      </form>
    </div>
  </div>
</div>

<!-- ============================== APP CONTAINER ============================== -->
<div class="app-container" id="appContainer">
  
  <!-- ====== SIDEBAR ====== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>✈ VisaPilot <span class="badge">v2.0</span></h2>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Dynamic nav items rendered by JS -->
    </nav>
    <div class="sidebar-footer" id="sidebarFooter">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="sidebarUserName">用户</div>
        <div class="user-role" id="sidebarUserRole">普通用户</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" title="退出登录">↩</button>
    </div>
  </aside>

  <!-- Mobile menu button -->
  <button class="mobile-menu-btn" id="mobileMenuBtn">☰ 菜单</button>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="main-content" id="mainContent">
    <!-- Dynamic pages rendered by JS -->
  </main>
</div>

<!-- ============================== MODAL CONTAINER ============================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
