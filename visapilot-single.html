          <p>单位/学校：${userInfo.company || '-'}</p>
          <p>职位：${userInfo.position || '-'}</p>
        </div>
        <div class="vp-package-section">
          <h5>📋 完整材料清单</h5>
          <ul>
    `;

    templates.forEach(t => {
      const req = t.required === true ? '必交' : (t.required === 'conditional' ? '视情况' : '可选');
      html += `<li>[${req}] ${t.name} — ${t.note || ''}</li>`;
    });

    html += `
          </ul>
        </div>
        <div class="vp-package-section">
          <h5>✈️ 出行说明</h5>
          <p>${userInfo.tripPurpose || '-'}</p>
        </div>
        <div class="vp-package-section">
          <h5>📝 在线申请表填写指引</h5>
          <p>请访问 ${country.name} 签证中心官网在线填写签证申请表，如实填写所有信息。</p>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="vp-btn vp-btn-sm" onclick="VPDIY.copyPackage(this)">📋 一键复制</button>
          <button class="vp-btn vp-btn-sm" onclick="VPDIY.downloadPackage()">⬇ 下载 .txt</button>
        </div>
      </div>
    `;

    return html;
  }

  function copyPackage(btn) {
    const text = btn.closest('.vp-material-package').textContent;
    navigator.clipboard.writeText(text).then(() => VPApp.showToast('📋 已复制','success')).catch(() => VPApp.showToast('复制失败','error'));
  }

  function downloadPackage() {
    const text = document.querySelector('.vp-material-package')?.textContent;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '材料包_' + new Date().toISOString().slice(0,10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return {
    uploadMaterial, getUploadedMaterials, renderUploadSection,
    handleUpload, submitForReview, jumpToCalendar,
    generateItinerary, copyItinerary, downloadItinerary,
    renderInsurance, uploadInsurance,
    renderTranslation, translateFile, toggleTranslation, downloadTranslation,
    generateMaterialPackage, copyPackage, downloadPackage,
  };
})();


/* ===== admin.js ===== */
/**
 * VisaPilot — 管理后台
 * 用户管理、代办审核、分配、对话、审核管理
 */

const VPAdmin = (function() {
  'use strict';

  function init() {
    renderUsers();
    renderAgentReviews();
    renderReviewMgmt();
    renderAllocation();
    renderConversations();
  }

  // ========= 用户管理 =========
  function renderUsers() {
    const container = document.getElementById('vp-admin-users');
    if (!container) return;
    const users = VPStorage.getAllUsers().filter(u => u.role !== 'admin');

    if (users.length === 0) {
      container.innerHTML = '<div class="vp-empty-state">暂无注册用户</div>';
      return;
    }

    container.innerHTML = `
      <table class="vp-table">
        <thead>
          <tr>
            <th>注册时间</th><th>姓名</th><th>手机号</th><th>微信号</th><th>角色</th><th>状态</th><th>订单</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${new Date(u.createdAt).toLocaleDateString('zh-CN')}</td>
              <td>${u.name}</td>
              <td>${u.phone}</td>
              <td>${u.wechat || '-'}</td>
              <td>${u.role === 'agent' ? '🛎️ 代办' : '👤 用户'}</td>
              <td>${u.role === 'agent' ? (u.approved ? '🟢 已通过' : '🟡 待审核') : '✅ 正常'}</td>
              <td>${(VPStorage.getOrders().filter(o => o.userId === u.phone).length)}单</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // ========= 代办审核 =========
  function renderAgentReviews() {
    const container = document.getElementById('vp-admin-agent-reviews');
    if (!container) return;
    const reviews = VPStorage.getAgentReviews();

    if (reviews.length === 0) {
      container.innerHTML = '<div class="vp-empty-state">暂无代办申请</div>';
      return;
    }

    container.innerHTML = `
      <table class="vp-table">
        <thead>
          <tr><th>申请时间</th><th>姓名</th><th>手机号</th><th>微信号</th><th>简介</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody>
          ${reviews.map(r => `
            <tr>
              <td>${new Date(r.createdAt).toLocaleDateString('zh-CN')}</td>
              <td>${r.name}</td>
              <td>${r.phone}</td>
              <td>${r.wechat || '-'}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.info || '-'}</td>
              <td>${r.status === 'pending' ? '🟡 待审核' : r.status === 'approved' ? '🟢 已通过' : '🔴 已拒绝'}</td>
              <td>
                ${r.status === 'pending' ? `
                  <button class="vp-btn vp-btn-sm vp-btn-success" onclick="VPAdmin.approveAgent('${r.phone}')">✅ 通过</button>
                  <button class="vp-btn vp-btn-sm vp-btn-danger" onclick="VPAdmin.rejectAgent('${r.phone}')">❌ 拒绝</button>
                ` : (r.status === 'approved' ? '✅ 已通过' : '❌ 已拒绝')}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function approveAgent(phone) {
    const users = VPStorage.getUsers();
    const user = users.find(u => u.phone === phone);
    if (user) {
      user.approved = true;
      VPStorage.saveUser(user);
    }
    const reviews = VPStorage.getAgentReviews();
    const r = reviews.find(r => r.phone === phone);
    if (r) r.status = 'approved';
    VPStorage.setAgentReviews(reviews);
    renderAgentReviews();
    VPApp.showToast('✅ 代办已通过审核','success');
  }

  function rejectAgent(phone) {
    const reviews = VPStorage.getAgentReviews();
    const r = reviews.find(r => r.phone === phone);
    if (r) r.status = 'rejected';
    VPStorage.setAgentReviews(reviews);
    renderAgentReviews();
    VPApp.showToast('✅ 代办申请已拒绝','info');
  }

  // ========= 审核管理 =========
  function renderReviewMgmt() {
    const container = document.getElementById('vp-admin-reviews');
    if (!container) return;
    const reviews = VPStorage.getReviews();

    if (reviews.length === 0) {
      container.innerHTML = '<div class="vp-empty-state">暂无审核记录</div>';
      return;
    }

    container.innerHTML = `
      <table class="vp-table">
        <thead>
          <tr><th>时间</th><th>用户</th><th>国家</th><th>签证类型</th><th>材料数</th><th>状态</th><th>专员</th></tr>
        </thead>
        <tbody>
          ${reviews.map(r => `
            <tr>
              <td>${new Date(r.createdAt).toLocaleDateString('zh-CN')}</td>
              <td>${r.userName || r.userId}</td>
              <td>${r.countryName || r.countryId}</td>
              <td>${r.visaType}</td>
              <td>${r.materialCount || 0}</td>
              <td>${r.status === 'pending' ? '🟡 待审核' : r.status === 'reviewing' ? '🔍 审核中' : r.status === 'approved' ? '✅ 通过' : '❌ 退回'}</td>
              <td>${r.agentName || '未分配'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // ========= 分配系统 =========
  function renderAllocation() {
    const container = document.getElementById('vp-admin-allocation');
    if (!container) return;
    const consultations = VPStorage.getConsultations().filter(c => !c.assignedTo);
    const agents = VPStorage.getUsers().filter(u => u.role === 'agent' && u.approved);
    const orders = VPStorage.getOrders().filter(o => o.status === 'pending');

    let html = '<h4>未分配的咨询</h4>';
    if (consultations.length === 0) {
      html += '<div class="vp-empty-state">暂无未分配咨询</div>';
    } else {
      html += `
        <table class="vp-table">
          <thead><tr><th>时间</th><th>姓名</th><th>手机</th><th>国家</th><th>分配</th></tr></thead>
          <tbody>
            ${consultations.map(c => `
              <tr>
                <td>${new Date(c.createdAt).toLocaleDateString('zh-CN')}</td>
                <td>${c.name}</td>
                <td>${c.phone}</td>
                <td>${c.country}</td>
                <td>
                  <select class="vp-select vp-select-sm" data-consult-id="${c.id}">
                    <option value="">选择专员</option>
                    ${agents.map(a => `<option value="${a.phone}">${a.name}</option>`).join('')}
                  </select>
                  <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPAdmin.assignConsult(this)">分配</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    html += '<h4 style="margin-top:20px">待处理订单</h4>';
    if (orders.length === 0) {
      html += '<div class="vp-empty-state">暂无待处理订单</div>';
    } else {
      html += `
        <table class="vp-table">
          <thead><tr><th>时间</th><th>用户</th><th>套餐</th><th>金额</th><th>分配</th></tr></thead>
          <tbody>
            ${orders.map(o => `
              <tr>
                <td>${new Date(o.createdAt).toLocaleDateString('zh-CN')}</td>
                <td>${o.userName || o.userId}</td>
                <td>${o.plan || '标准'}</td>
                <td>¥${o.amount || 0}</td>
                <td>
                  <select class="vp-select vp-select-sm" data-order-id="${o.id}">
                    <option value="">选择专员</option>
                    ${agents.map(a => `<option value="${a.phone}">${a.name}</option>`).join('')}
                  </select>
                  <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPAdmin.assignOrder(this)">分配</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    container.innerHTML = html;
  }

  function assignConsult(btn) {
    const row = btn.closest('tr');
    const select = row.querySelector('select');
    const agentPhone = select.value;
    const consultId = select.dataset.consultId;
    if (!agentPhone) { VPApp.showToast('请选择专员','warning'); return; }

    const consultations = VPStorage.getConsultations();
    const c = consultations.find(cc => cc.id === consultId);
    if (c) {
      c.assignedTo = agentPhone;
      VPStorage.setConsultations(consultations);
      // 发送系统通知
      const convId = 'consult_' + consultId;
      VPChat.sendMessage(convId, `📢 系统通知：管理员已将 ${c.name} 分配给您。国家：${c.country}，签证：${c.visaType}。`);
      VPApp.showToast('✅ 已分配','success');
      renderAllocation();
    }
  }

  function assignOrder(btn) {
    const row = btn.closest('tr');
    const select = row.querySelector('select');
    const agentPhone = select.value;
    const orderId = select.dataset.orderId;
    if (!agentPhone) { VPApp.showToast('请选择专员','warning'); return; }

    const orders = VPStorage.getOrders();
    const o = orders.find(oo => oo.id === orderId);
    if (o) {
      o.status = 'assigned';
      o.assignedTo = agentPhone;
      VPStorage.setOrders(orders);
      const convId = 'order_' + orderId;
      VPChat.sendMessage(convId, `📢 系统通知：管理员已将订单分配给专员。订单号：${orderId}`);
      VPApp.showToast('✅ 已分配','success');
      renderAllocation();
    }
  }

  // ========= 对话面板 =========
  function renderConversations() {
    const container = document.getElementById('vp-admin-conversations');
    if (!container) return;

    // 收集所有对话
    const allMsgs = VPStorage.getAllConversations();
    const convKeys = Object.keys(allMsgs);

    if (convKeys.length === 0) {
      container.innerHTML = '<div class="vp-empty-state">暂无对话记录</div>';
      return;
    }

    // 渲染对话列表
    let listHtml = '<div class="vp-chat-list">';
    convKeys.forEach(key => {
      const msgs = allMsgs[key];
      const lastMsg = msgs[msgs.length - 1];
      const preview = lastMsg ? (lastMsg.content ? lastMsg.content.slice(0,30) : '[文件]') : '';
      const unread = msgs.filter(m => !m.read && m.sender !== 'admin').length;
      listHtml += `<div class="vp-chat-item" onclick="VPAdmin.openConv('${key}')">
        <div class="vp-chat-item-name">${key}</div>
        <div class="vp-chat-item-preview">${preview}</div>
        ${unread > 0 ? `<span class="vp-badge vp-badge-danger">${unread}</span>` : ''}
      </div>`;
    });
    listHtml += '</div>';
    listHtml += '<div id="vp-admin-chat-view" class="vp-chat-view"><div class="vp-empty-state">选择左侧对话查看</div></div>';

    container.innerHTML = listHtml;
  }

  let currentConvKey = null;

  function openConv(key) {
    currentConvKey = key;
    const view = document.getElementById('vp-admin-chat-view');
    if (!view) return;

    // 标记为已读
    const allMsgs = VPStorage.getAllConversations();
    if (allMsgs[key]) {
      allMsgs[key].forEach(m => { if (m.sender !== 'admin') m.read = true; });
    }

    VPChat.renderChatMessages(key, 'vp-admin-chat-view');

    // 添加输入框
    const inputHtml = `
      <div class="vp-chat-input-area">
        <input type="text" class="vp-input" id="vp-admin-chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')VPAdmin.sendAdminMsg()">
        <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPAdmin.sendAdminMsg()">发送</button>
      </div>
    `;
    view.innerHTML += inputHtml;
    VPChat.renderChatMessages(key, 'vp-admin-chat-view');
  }

  function sendAdminMsg() {
    if (!currentConvKey) return;
    const input = document.getElementById('vp-admin-chat-input');
    if (!input || !input.value.trim()) return;
    VPChat.sendMessage(currentConvKey, input.value.trim());
    input.value = '';
    openConv(currentConvKey);
  }

  return {
    init, renderUsers, renderAgentReviews, renderReviewMgmt,
    renderAllocation, renderConversations,
    approveAgent, rejectAgent,
    assignConsult, assignOrder,
    openConv, sendAdminMsg,
  };
})();


/* ===== agent.js ===== */
/**
 * VisaPilot — 代办工作台
 * 订单面板、对话、材料审核
 */

const VPAgent = (function() {
  'use strict';

  function init() {
    renderOrders();
    renderAgentConversations();
    renderMaterialReviews();
  }

  // ========= 订单面板 =========
  function renderOrders() {
    const container = document.getElementById('vp-agent-orders');
    if (!container) return;
    const agent = VPAuth.currentUser();
    if (!agent) { container.innerHTML = '<div class="vp-empty-state">请先登录</div>'; return; }

    const allOrders = VPStorage.getOrders();
    const pending = allOrders.filter(o => o.status === 'pending' && !o.assignedTo);
    const myOrders = allOrders.filter(o => o.assignedTo === agent.phone);

    let html = '<h4>📋 待接单</h4>';
    if (pending.length === 0) {
      html += '<div class="vp-empty-state">暂无待接订单</div>';
    } else {
      pending.forEach(o => {
        const commission = Math.round((o.amount || 0) * 0.7);
        html += `
          <div class="vp-order-card">
            <div class="vp-order-header">
              <strong>${o.userName || '用户'}</strong>
              <span class="vp-order-time">${new Date(o.createdAt).toLocaleDateString('zh-CN')}</span>
            </div>
            <div class="vp-order-body">
              <p>目标：${o.country || ''} ${o.visaType || ''}</p>
              <p>备注：${o.remark || '-'}</p>
              <p class="vp-order-commission">订单原价：¥${o.amount || 0} &nbsp;|&nbsp; 您获得：¥${commission}（平台抽成30%）</p>
            </div>
            <button class="vp-btn vp-btn-sm vp-btn-success" onclick="VPAgent.acceptOrder('${o.id}')">✅ 接单</button>
          </div>
        `;
      });
    }

    html += '<h4 style="margin-top:16px">📋 已接单</h4>';
    if (myOrders.length === 0) {
      html += '<div class="vp-empty-state">暂无已接订单</div>';
    } else {
      myOrders.forEach(o => {
        const commission = Math.round((o.amount || 0) * 0.7);
        html += `
          <div class="vp-order-card vp-order-card-done">
            <div class="vp-order-header">
              <strong>${o.userName || '用户'}</strong>
              <span class="vp-order-status">${o.status === 'assigned' ? '已接单' : o.status === 'processing' ? '处理中' : '已完成'}</span>
            </div>
            <div class="vp-order-body">
              <p>目标：${o.country || ''} ${o.visaType || ''}</p>
              <p>订单原价：¥${o.amount || 0} &nbsp;|&nbsp; 您获得：¥${commission}</p>
            </div>
            <button class="vp-btn vp-btn-sm" onclick="VPApp.showTab('agent','chat')">💬 联系用户</button>
          </div>
        `;
      });
    }

    container.innerHTML = html;
  }

  function acceptOrder(orderId) {
    const agent = VPAuth.currentUser();
    if (!agent) { VPApp.showToast('请先登录','warning'); return; }
    const orders = VPStorage.getOrders();
    const o = orders.find(oo => oo.id === orderId);
    if (o) {
      o.status = 'assigned';
      o.assignedTo = agent.phone;
      VPStorage.setOrders(orders);

      // 创建系统通知
      const convId = 'order_' + orderId;
      VPChat.sendMessage(convId, `📢 系统通知：${agent.name} 已接单！专员将通过此对话与您沟通。`);
      VPApp.showToast('✅ 接单成功','success');
      renderOrders();
    }
  }

  // ========= 对话面板 =========
  function renderAgentConversations() {
    const container = document.getElementById('vp-agent-conversations');
    if (!container) return;
    const agent = VPAuth.currentUser();
    if (!agent) { container.innerHTML = '<div class="vp-empty-state">请先登录</div>'; return; }

    const myOrders = VPStorage.getOrders().filter(o => o.assignedTo === agent.phone);
    const myConsultations = VPStorage.getConsultations().filter(c => c.assignedTo === agent.phone);

    const convs = [];

    myOrders.forEach(o => {
      const convId = 'order_' + o.id;
      const msgs = VPStorage.getMessages(convId);
      convs.push({ id: convId, name: o.userName || '用户', preview: msgs.length > 0 ? (msgs[msgs.length-1].content||'[文件]') : '暂无消息' });
    });
    myConsultations.forEach(c => {
      const convId = 'consult_' + c.id;
      const msgs = VPStorage.getMessages(convId);
      convs.push({ id: convId, name: c.name, preview: msgs.length > 0 ? (msgs[msgs.length-1].content||'[文件]') : '暂无消息' });
    });

    if (convs.length === 0) {
      container.innerHTML = '<div class="vp-empty-state">暂无对话</div>';
      return;
    }

    let html = '<div class="vp-chat-list">';
    convs.forEach(conv => {
      html += `<div class="vp-chat-item" onclick="VPAgent.openAgentConv('${conv.id}')">
        <div class="vp-chat-item-name">${conv.name}</div>
        <div class="vp-chat-item-preview">${conv.preview}</div>
      </div>`;
    });
    html += '</div><div id="vp-agent-chat-view" class="vp-chat-view"><div class="vp-empty-state">选择客户开始对话</div></div>';
    container.innerHTML = html;
  }

  let currentAgentConv = null;

  function openAgentConv(convId) {
    currentAgentConv = convId;
    const view = document.getElementById('vp-agent-chat-view');
    if (!view) return;
    VPChat.renderChatMessages(convId, 'vp-agent-chat-view');

    // 添加输入区域带文件上传
    const inputHtml = `
      <div class="vp-chat-input-area">
        <input type="file" id="vp-agent-file-input" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx" style="display:none" onchange="VPAgent.sendAgentFile(event)">
        <button class="vp-btn vp-btn-sm" onclick="document.getElementById('vp-agent-file-input').click()" title="发送文件">📎</button>
        <input type="text" class="vp-input" id="vp-agent-chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')VPAgent.sendAgentMsg()">
        <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPAgent.sendAgentMsg()">发送</button>
      </div>
    `;
    view.innerHTML += inputHtml;
    VPChat.renderChatMessages(convId, 'vp-agent-chat-view');
  }

  function sendAgentMsg() {
    if (!currentAgentConv) return;
    const input = document.getElementById('vp-agent-chat-input');
    if (!input || !input.value.trim()) return;
    VPChat.sendMessage(currentAgentConv, input.value.trim());
    input.value = '';
    openAgentConv(currentAgentConv);
  }

  function sendAgentFile(event) {
    const file = event.target.files[0];
    if (!file || !currentAgentConv) return;
    if (file.size > 2 * 1024 * 1024) { VPApp.showToast('文件不能超过2MB','warning'); return; }

    const reader = new FileReader();
    reader.onload = function(e) {
      VPChat.sendMessage(currentAgentConv, '', {
        name: file.name,
        data: e.target.result,
      });
      openAgentConv(currentAgentConv);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  // ========= 材料审核 =========
  function renderMaterialReviews() {
    const container = document.getElementById('vp-agent-reviews');
    if (!container) return;
    const agent = VPAuth.currentUser();
    if (!agent) { container.innerHTML = '<div class="vp-empty-state">请先登录</div>'; return; }

    const reviews = VPStorage.getReviews();
    const pendingReviews = reviews.filter(r => r.status === 'pending' && !r.agentPhone);
    const myReviews = reviews.filter(r => r.agentPhone === agent.phone);

    let html = '<h4>📋 待审核材料</h4>';
    if (pendingReviews.length === 0) {
      html += '<div class="vp-empty-state">暂无待审核材料</div>';
    } else {
      pendingReviews.forEach(r => {
        html += `
          <div class="vp-order-card">
            <div class="vp-order-header">
              <strong>${r.userName || r.userId}</strong>
              <span>${new Date(r.createdAt).toLocaleDateString('zh-CN')}</span>
            </div>

    html += '<h4 style="margin-top:16px">📋 已审核材料</h4>';
    if (myReviews.length === 0) {
      html += '<div class="vp-empty-state">暂无已审核材料</div>';
    } else {
      myReviews.forEach(r => {
        const statusText = r.status === 'reviewing' ? '🔍 审核中' : r.status === 'approved' ? '✅ 已通过' : '❌ 已退回';

          </div>
        `;
      });
    }
    container.innerHTML = html;
  }

  function acceptReview(reviewId) {
    const agent = VPAuth.currentUser();
    if (!agent) { VPApp.showToast('请先登录','warning'); return; }
    VPStorage.updateReview(reviewId, { status: 'reviewing', agentPhone: agent.phone, agentName: agent.name });
    VPApp.showToast('✅ 已接单审核','success');
    renderMaterialReviews();
  }

  function showReviewDetail(reviewId) {
    const review = VPStorage.getReviews().find(r => r.id === reviewId);
    if (!review) return;
    const container = document.getElementById('vp-agent-reviews');
    if (!container) return;

    // 获取用户上传的材料
    const uploads = VPStorage.getUploads(review.userId);
    const materials = review.materials || [];
    const countryConfig = VISAPILOT.VISA_CONFIG[review.countryId];
    const templates = VISAPILOT.MATERIAL_TEMPLATES[review.visaType === '旅游(B1/B2)' ? '旅游' : review.visaType.replace(/\(.*\)/,'')] || [];

    let html = `
      <div class="vp-review-detail">
        <div class="vp-review-header">
          <button class="vp-btn vp-btn-sm" onclick="VPAgent.renderMaterialReviews()">← 返回</button>
          <h3>${review.countryFlag || ''} ${review.countryName || review.countryId} · ${review.visaType}</h3>
          <p>用户：${review.userName || review.userId}</p>
        </div>
        <table class="vp-table">
          <thead>
            <tr><th>材料名称</th><th>上传文件</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody>
    `;

    templates.forEach(tmpl => {
      const uploaded = uploads[review.countryId + '_' + review.visaType + '_' + tmpl.id];
      const materialStatus = review.materialStatus ? review.materialStatus[tmpl.id] : null;
      const statusIcon = materialStatus === 'approved' ? '✅' : materialStatus === 'rejected' ? '❌' : '⏳';
      const statusText = materialStatus === 'approved' ? '已通过' : materialStatus === 'rejected' ? '需修改' : '待审核';

      let fileHtml = '-';
      if (uploaded) {
        const ext = uploaded.name ? uploaded.name.split('.').pop().toLowerCase() : '';
        const isImg = ['jpg','jpeg','png','gif','webp'].includes(ext);
        const isPdf = ext === 'pdf';
        const isWord = ['doc','docx'].includes(ext);

        if (isImg && uploaded.data) {
          fileHtml = `<span>${uploaded.name}</span> <button class="vp-btn vp-btn-xs" onclick="VPAgent.viewFile('${uploaded.data}','${ext}')">👁 预览</button>`;
        } else if (isPdf && uploaded.data) {
          fileHtml = `<span>${uploaded.name}</span> <button class="vp-btn vp-btn-xs" onclick="VPAgent.viewFile('${uploaded.data}','${ext}')">📄 阅读</button>`;
        } else if (isWord && uploaded.data) {
          fileHtml = `<span>${uploaded.name}</span> <button class="vp-btn vp-btn-xs" onclick="VPAgent.viewFile('${uploaded.data}','${ext}')">📝 阅读</button>`;
        } else if (uploaded.data) {
          fileHtml = `<span>${uploaded.name}</span> <button class="vp-btn vp-btn-xs" onclick="VPAgent.downloadFile('${uploaded.data}','${uploaded.name}')">⬇ 下载</button>`;
        } else {
          fileHtml = `<span>${uploaded.name}</span> <span class="vp-text-muted">(仅文件名)</span>`;
        }
      }

      html += `
        <tr>
          <td>${tmpl.name}</td>
          <td style="max-width:200px;word-break:break-all">${fileHtml}</td>
          <td class="vp-status-${materialStatus || 'pending'}">${statusIcon} ${statusText}</td>
          <td>
            <button class="vp-btn vp-btn-xs vp-btn-success" onclick="VPAgent.approveMaterial('${reviewId}','${tmpl.id}')">✅ 通过</button>
            <button class="vp-btn vp-btn-xs vp-btn-danger" onclick="VPAgent.rejectMaterial('${reviewId}','${tmpl.id}')">❌ 退回</button>
          </td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="vp-btn vp-btn-success" onclick="VPAgent.approveAll('${reviewId}')">✅ 全部通过</button>
        </div>
    `;

    // 退回原因输入区域
    if (review.rejectedMaterial) {
      html += `<div id="vp-reject-reason-area" style="margin-top:12px;background:var(--bg-muted);padding:12px;border-radius:8px">
        <label>退回原因：</label>
        <input type="text" class="vp-input" id="vp-reject-reason-input" placeholder="输入退回原因（可选）" style="width:300px">
        <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPAgent.saveRejectReason('${reviewId}')">💾 保存</button>
      </div>`;
    }

    html += '</div>';
    container.innerHTML = html;
  }

  function approveMaterial(reviewId, materialId) {
    const review = VPStorage.getReviews().find(r => r.id === reviewId);
    if (!review) return;
    if (!review.materialStatus) review.materialStatus = {};
    review.materialStatus[materialId] = 'approved';
    VPStorage.updateReview(reviewId, { materialStatus: review.materialStatus });
    showReviewDetail(reviewId);
  }

  function rejectMaterial(reviewId, materialId) {
    const review = VPStorage.getReviews().find(r => r.id === reviewId);
    if (!review) return;
    if (!review.materialStatus) review.materialStatus = {};
    review.materialStatus[materialId] = 'rejected';
    review.rejectedMaterial = materialId;
    VPStorage.updateReview(reviewId, { materialStatus: review.materialStatus, rejectedMaterial: materialId });
    showReviewDetail(reviewId);

    // 自动聚焦输入框
    setTimeout(() => {
      const input = document.getElementById('vp-reject-reason-input');
      if (input) input.focus();
    }, 100);
  }

  function saveRejectReason(reviewId) {
    const input = document.getElementById('vp-reject-reason-input');
    if (!input) return;
    const reason = input.value.trim();
    const review = VPStorage.getReviews().find(r => r.id === reviewId);
    if (review && review.rejectedMaterial) {
      if (!review.rejectReasons) review.rejectReasons = {};
      review.rejectReasons[review.rejectedMaterial] = reason;
      VPStorage.updateReview(reviewId, { rejectReasons: review.rejectReasons });
      VPApp.showToast('💾 退回原因已保存','success');
      showReviewDetail(reviewId);
    }
  }

  function approveAll(reviewId) {
    const review = VPStorage.getReviews().find(r => r.id === reviewId);
    if (!review) return;
    VPStorage.updateReview(reviewId, { status: 'approved', approvedAt: new Date().toISOString() });
    VPApp.showToast('✅ 所有材料已审核通过！','success');
    renderMaterialReviews();
  }

  function viewFile(data, ext) {
    if (!data) { VPApp.showToast('文件数据不可用','warning'); return; }
    const isImg = ['jpg','jpeg','png','gif','webp'].includes(ext);
    const isPdf = ext === 'pdf';
    const isWord = ['doc','docx'].includes(ext);

    if (isImg) {
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${data}" style="max-width:100%;max-height:100vh;object-fit:contain" /></body></html>`);
      } else {
        // 降级下载
        downloadFile(data, 'preview.'+ext);
      }
    } else if (isPdf) {
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`<html><body style="margin:0;height:100vh"><embed src="${data}" type="application/pdf" width="100%" height="100%" /></body></html>`);
      } else {
        downloadFile(data, 'document.pdf');
      }
    } else if (isWord) {
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`
          <html><body style="font-family:sans-serif;padding:40px;max-width:600px;margin:auto;text-align:center">
            <h2>📝 Word 文档下载</h2>
            <p>请点击下方按钮下载文件</p>
            <a href="${data}" download="document.${ext}" style="display:inline-block;padding:12px 24px;background:#0066cc;color:white;border-radius:6px;text-decoration:none;margin-top:20px">⬇ 一键下载</a>
          </body></html>`);
      } else {
        downloadFile(data, 'document.'+ext);
      }
    } else {
      downloadFile(data, 'file.'+ext);
    }
  }

  function downloadFile(data, filename) {
    const a = document.createElement('a');
    a.href = data;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  return {
    init, renderOrders, acceptOrder,
    renderAgentConversations, openAgentConv, sendAgentMsg, sendAgentFile,
    renderMaterialReviews, acceptReview, showReviewDetail,
    approveMaterial, rejectMaterial, saveRejectReason, approveAll,
    viewFile, downloadFile,
  };
})();

    if (!query.trim()) { results.innerHTML = ''; results.classList.remove('vp-show'); return; }

    const q = query.toLowerCase();
    const hits = VISAPILOT.COUNTRIES.filter(c =>
      c.name.includes(q) || c.flag.includes(q) || c.id.includes(q)
    );

    if (hits.length === 0) {
      results.innerHTML = '<div class="vp-search-empty">未找到匹配国家</div>';
    } else {
      results.innerHTML = hits.map(c => `
        <div class="vp-search-item" onclick="VPApp.navigateToCountry('${c.id}')">
          ${c.flag} ${c.name} ${c.hot ? '🔥' : ''}
        </div>
      `).join('');
    }
    results.classList.add('vp-show');
  }

  function clickSchengenCountry(code, name) {
    var standaloneMap = { fra:'france', ita:'italy', esp:'spain', deu:'germany', nld:'netherlands', che:'switzerland' };
    var standaloneId = standaloneMap[code];
    if (standaloneId && VISAPILOT.VISA_CONFIG[standaloneId]) {
      VPApp.navigateToCountry(standaloneId);
    } else {
      VPApp.navigateToCountry('schengen');
      // 在申根页内跳转到对应国家位置（或显示该国信息）
      setTimeout(function() {
        var cards = document.querySelectorAll('.vp-country-card');
        for (var i = 0; i < cards.length; i++) {
          if (cards[i].textContent.includes(name)) {
            cards[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
            cards[i].style.border = '2px solid var(--primary)';
            cards[i].style.boxShadow = '0 0 0 4px rgba(37,99,235,0.2)';
            setTimeout(function() { cards[i].style.border = ''; cards[i].style.boxShadow = ''; }, 1500);
            break;
          }
        }
      }, 100);
    }
  }

    const preference = document.getElementById('vp-it-preference')?.value || 'mixed';

      const reviews = VPStorage.getReviews().filter(r => r.userId === user.phone);
      content.innerHTML = renderReviewList(reviews);
    }
  }

  function renderBookingList(bookings) {
    if (bookings.length === 0) return '<div class="vp-empty-state">暂无预约记录</div>';

    return `
      <div class="vp-booking-list">
        ${bookings.map(b => `
          <div class="vp-booking-card">
            <div class="vp-booking-card-header">
              <span>${b.countryFlag || ''} ${b.countryName || b.countryId} · ${b.visaType}</span>
              <span class="vp-booking-status vp-booking-confirmed">✅ 已预约</span>
            </div>
            <div class="vp-booking-card-body">
              <p>📅 ${b.date} ${b.time}</p>
              <p>📍 ${b.center || '-'}</p>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderReviewList(reviews) {
    if (reviews.length === 0) return '<div class="vp-empty-state">暂无审核记录</div>';

    return `
      <div class="vp-booking-list">
        ${reviews.map(r => {
          const statusMap = {
            'pending': { icon: '⏳', text: '等待签证官接单', color: 'var(--text-muted)' },
            'reviewing': { icon: '🔍', text: '审核中', color: 'var(--info)' },
            'approved': { icon: '✅', text: '审核通过', color: 'var(--success)' },
            'rejected': { icon: '❌', text: '需修改', color: 'var(--danger)' },
          };
          const st = statusMap[r.status] || statusMap['pending'];
          const hasReject = r.status === 'rejected';

          // 获取材料状态明细
          let materialsHtml = '';
          if (r.materialStatus) {
            materialsHtml = `<div class="vp-review-materials">
              ${Object.entries(r.materialStatus).map(([k, v]) => `
                <span class="vp-review-material-tag ${v === 'approved' ? 'vp-tag-ok' : 'vp-tag-fail'}">
                  ${v === 'approved' ? '✅' : '❌'} ${k}
                  ${v === 'rejected' && r.rejectReasons?.[k] ? `<span class="vp-text-muted" title="${r.rejectReasons[k]}">📝</span>` : ''}
                </span>
              `).join('')}
            </div>`;
          }

          return `
            <div class="vp-booking-card" style="border-left:3px solid ${st.color}">
              <div class="vp-booking-card-header">
                <span>${r.countryFlag || ''} ${r.countryName || r.countryId} · ${r.visaType}</span>
                <span style="color:${st.color}">${st.icon} ${st.text}</span>
              </div>
              <div class="vp-booking-card-body">
                <p>提交时间：${new Date(r.createdAt).toLocaleDateString('zh-CN')} · ¥100</p>
                ${r.agentName ? `<p>签证官：${r.agentName}</p>` : ''}
                ${materialsHtml ? `<div style="margin-top:8px">${materialsHtml}</div>` : ''}
              </div>
              <div class="vp-booking-card-actions">
                ${hasReject ? `<button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPApp.navigateToCountry('${r.countryId}','${r.visaType}')">🔄 重新提交材料</button>` : ''}
                ${r.agentPhone ? `<button class="vp-btn vp-btn-sm vp-btn-outline" onclick="VPUI.openReviewChat('${r.id}','${r.countryId}','${r.visaType}')">💬 联系签证官</button>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function openReviewChat(reviewId, countryId, visaType) {
    const config = VISAPILOT.VISA_CONFIG[countryId];
    const convId = 'review_' + reviewId;
    const review = VPStorage.getReviews().find(r => r.id === reviewId);

    // 创建一个内嵌聊天弹窗
    const modal = document.createElement('div');
    modal.className = 'vp-modal-overlay';
    modal.innerHTML = `
      <div class="vp-modal vp-modal-lg" style="max-width:500px">
        <div class="vp-modal-header">
          <h3>💬 ${config?.flag || ''} ${config?.name || ''} · ${visaType}</h3>
          <button class="vp-modal-close" onclick="this.closest('.vp-modal-overlay').remove()">✕</button>
        </div>
        <div class="vp-modal-body" style="height:400px;display:flex;flex-direction:column">
          <div id="vp-review-chat-msgs" class="vp-chat-view" style="flex:1;overflow-y:auto;padding:8px;background:var(--bg-card);border-radius:8px;margin-bottom:8px"></div>
          <div class="vp-chat-input-area">
            <input type="file" id="vp-review-file-input" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx" style="display:none" onchange="VPUI.sendReviewFile('${convId}',event)">
            <button class="vp-btn vp-btn-sm" onclick="document.getElementById('vp-review-file-input').click()">📎</button>
            <input type="text" class="vp-input" id="vp-review-chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')VPUI.sendReviewMsg('${convId}')">
            <button class="vp-btn vp-btn-sm vp-btn-primary" onclick="VPUI.sendReviewMsg('${convId}')">发送</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    // 加载消息
    VPChat.renderChatMessages(convId, 'vp-review-chat-msgs');
  }

  function sendReviewMsg(convId) {
    const input = document.getElementById('vp-review-chat-input');
    if (!input || !input.value.trim()) return;
    VPChat.sendMessage(convId, input.value.trim());
    input.value = '';
    VPChat.renderChatMessages(convId, 'vp-review-chat-msgs');
  }

  function sendReviewFile(convId, event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { VPApp.showToast('文件不能超过2MB','warning'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      VPChat.sendMessage(convId, '', { name: file.name, data: e.target.result });
      VPChat.renderChatMessages(convId, 'vp-review-chat-msgs');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  // ========= 个人中心 =========
  function renderProfile() {
    const main = document.getElementById('vp-main-content');
    if (!main) return;
    const user = VPAuth.currentUser();
    if (!user) { VPApp.showLogin(); return; }

    main.innerHTML = `

          <p><strong>注册时间：</strong>${new Date(user.createdAt).toLocaleString('zh-CN')}</p>
          <button class="vp-btn vp-btn-danger" onclick="VPApp.logout()">🚪 退出登录</button>
        </div>
      </div>
    `;
  }

  // ========= 咨询表单 =========
  function showConsultForm() {
    const modal = document.createElement('div');

    modal.innerHTML = `
      <div class="vp-modal">

            <label>手机号：<input class="vp-input" id="vp-consult-phone" placeholder="请输入手机号"></label>
            <label>微信号：<input class="vp-input" id="vp-consult-wechat" placeholder="请输入微信号（选填）"></label>

            <label>签证类型：<input class="vp-input" id="vp-consult-visa" placeholder="如：旅游签证"></label>
            <label>备注：<textarea class="vp-input" id="vp-consult-remark" rows="3" placeholder="其他需要咨询的问题..."></textarea></label>
            <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPUI.submitConsult()">提交咨询</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function submitConsult() {
    const name = document.getElementById('vp-consult-name')?.value.trim();
    const phone = document.getElementById('vp-consult-phone')?.value.trim();
    const wechat = document.getElementById('vp-consult-wechat')?.value.trim();

    const visaType = document.getElementById('vp-consult-visa')?.value.trim();

  // ========= Helper =========
  function getProcessTime(countryId) {
    const times = { usa:'5-15', uk:'15-30', schengen:'10-20', france:'10-20', italy:'10-20',
      spain:'10-20', germany:'10-20', netherlands:'10-20', switzerland:'10-20',

/**
 * VisaPilot — 主应用控制器
 * 状态管理、路由、导航、全局工具
 */

const VPApp = (function() {
  'use strict';

  let currentCountryId = null;
  let currentVisaType = null;

  // ========= 初始化 =========
  function init() {
    VPStorage.initPresetAccounts();
    VPUI.renderSidebar();
    VPUI.renderHome();
    initNav();
    initFloatingButtons();
    initAIChat();
    renderUserStatus();
    checkAutoLogin();
  }

  function checkAutoLogin() {
    if (VPStorage.isLoggedIn()) {
      renderUserStatus();
    }
  }

  // ========= 导航 =========
  function initNav() {
    // 导航栏按钮事件
    document.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', function(e) {
        const nav = this.dataset.nav;
        switch (nav) {
          case 'home': VPUI.renderHome(); break;
          case 'consult': VPUI.showConsultForm(); break;
          case 'login': showLogin(); break;
          case 'register': showRegister(); break;
          case 'admin': showAdminLogin(); break;
          case 'agent': showAgentLogin(); break;
          case 'booking': openBooking('diy'); break;
        }
      });
    });
  }

  function navigateToCountry(countryId, visaType) {
    currentCountryId = countryId;
    currentVisaType = visaType || null;
    VPUI.renderCountryDetail(countryId);
    VPUI.renderSidebar();

    // 初始化日历
    setTimeout(() => {
      const vt = currentVisaType || VISAPILOT.VISA_CONFIG[countryId]?.types[0] || '旅游';
      VPCalendar.init(countryId, vt);
      VPCalendar.renderWaitTime(countryId);
    }, 100);
  }

  function switchVisaType(countryId, visaType) {
    currentVisaType = visaType;
    const content = document.getElementById('vp-visa-detail-content');
    if (content) {
      content.innerHTML = VPUI.renderVisaDetail(countryId, visaType);
    }
    // 更新标签高亮
    document.querySelectorAll('.vp-visa-tab').forEach(t => {
      t.classList.toggle('active', t.textContent === visaType);
    });
    // 重新初始化日历
    VPCalendar.init(countryId, visaType);
    VPCalendar.renderWaitTime(countryId);

    // 重新初始化 DIY
    const diyContent = document.getElementById('vp-diy-content');
    if (diyContent) {
      diyContent.innerHTML = '<p class="vp-text-muted">选择上方标签开始DIY服务</p>';
    }
  }

  // ========= 登录/注册弹窗 =========
  function showLogin() {
    const modal = document.createElement('div');
    modal.className = 'vp-modal-overlay';
    modal.innerHTML = `
      <div class="vp-modal">
        <div class="vp-modal-header">
          <h3>登录</h3>
          <button class="vp-modal-close" onclick="this.closest('.vp-modal-overlay').remove()">✕</button>
        </div>
        <div class="vp-modal-body">
          <div class="vp-login-tabs">
            <button class="vp-login-tab active" onclick="VPUI.switchLoginTab(this,'user')">👤 用户登录</button>
            <button class="vp-login-tab" onclick="VPUI.switchLoginTab(this,'agent')">🛎️ 签证官登录</button>
          </div>
          <div id="vp-login-form-area">
            <div class="vp-form">
              <label>邮箱/手机号：<input class="vp-input" id="vp-login-phone" placeholder="user@test.com 或手机号"></label>
              <label>密码：<input class="vp-input" id="vp-login-password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')VPApp.doLogin()"></label>
              <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doLogin()">登录</button>
              <p class="vp-form-footer">还没有账号？<a href="#" onclick="VPApp.showRegister();return false">立即注册</a></p>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  let loginRole = 'user';

  function doLogin() {
    const phone = document.getElementById('vp-login-phone')?.value.trim();
    const password = document.getElementById('vp-login-password')?.value;

    if (!phone || !password) { showToast('请填写邮箱/手机号和密码','warning'); return; }

    const result = VPAuth.login(phone, password);
    if (result.ok) {
      showToast(`✅ 登录成功，欢迎 ${result.user.name}！`,'success');
      document.querySelector('.vp-modal-overlay')?.remove();
      renderUserStatus();

      // 如果是代办，自动跳转到工作台
      if (result.user.role === 'agent') {
        showAgentDashboard();
      } else if (result.user.role === 'admin') {
        // admin登录通过管理入口
      }
    } else {
      showToast('❌ ' + result.error,'error');
    }
  }

  function showRegister() {
    document.querySelector('.vp-modal-overlay')?.remove();

    const modal = document.createElement('div');
    modal.className = 'vp-modal-overlay';
    modal.innerHTML = `
      <div class="vp-modal">
        <div class="vp-modal-header">
          <h3>注册</h3>
          <button class="vp-modal-close" onclick="this.closest('.vp-modal-overlay').remove()">✕</button>
        </div>
        <div class="vp-modal-body">
          <div class="vp-login-tabs">
            <button class="vp-login-tab active" onclick="VPUI.switchRegTab(this,'user')">👤 用户注册</button>
            <button class="vp-login-tab" onclick="VPUI.switchRegTab(this,'agent')">🛎️ 签证官注册</button>
          </div>
          <div id="vp-reg-form-area">
            <div class="vp-form">
              <label>姓名：<input class="vp-input" id="vp-reg-name" placeholder="请输入姓名"></label>
              <label>手机号：<input class="vp-input" id="vp-reg-phone" placeholder="请输入手机号"></label>
              <label>微信号：<input class="vp-input" id="vp-reg-wechat" placeholder="请输入微信号（选填）"></label>
              <label>密码：<input class="vp-input" id="vp-reg-password" type="password" placeholder="请设置密码（至少6位）"></label>
              <label class="vp-form-checkbox">
                <input type="checkbox" id="vp-reg-terms"> 我已阅读并同意《服务协议》
              </label>
              <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doRegister()">注册</button>
              <p class="vp-form-footer">已有账号？<a href="#" onclick="VPApp.showLogin();return false">立即登录</a></p>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    // 重置注册角色
    window._regRole = 'user';
  }

  function doRegister() {
    const name = document.getElementById('vp-reg-name')?.value.trim();
    const email = document.getElementById('vp-reg-email')?.value.trim();
    const phone = document.getElementById('vp-reg-phone')?.value.trim();
    const wechat = document.getElementById('vp-reg-wechat')?.value.trim();
    const password = document.getElementById('vp-reg-password')?.value;
    const role = window._regRole || 'user';

    if (!name || !email || !password) { showToast('请填写姓名、邮箱和密码','warning'); return; }
    if (password.length < 6) { showToast('密码至少6位','warning'); return; }

    const regRole = document.querySelector('#vp-reg-form-area .vp-form .vp-agent-fields') ? 'agent' : role;

    let agentInfo = null;
    if (regRole === 'agent') {
      const org = document.getElementById('vp-reg-agent-org')?.value;
      const years = document.getElementById('vp-reg-agent-years')?.value;
      const bio = document.getElementById('vp-reg-agent-bio')?.value;
      agentInfo = { org, years, bio };
    }

    const result = VPAuth.register({
      name, phone, email: email || phone, wechat, password,
      role: regRole,
      agentInfo,
    });

    if (result.ok) {
      if (regRole === 'agent') {
        showToast('✅ 签证官申请已提交，等待管理员审核','info');
      } else {
        showToast('✅ 注册成功，请登录','success');
      }
      document.querySelector('.vp-modal-overlay')?.remove();
      showLogin();
    } else {
      showToast('❌ ' + result.error,'error');
    }
  }

  function logout() {
    VPAuth.logout();
    renderUserStatus();
    showToast('已退出登录','info');
    VPUI.renderHome();
  }

  // ========= 用户状态栏 =========
  function renderUserStatus() {
    const el = document.getElementById('vp-user-status');
    if (!el) return;
    const user = VPAuth.currentUser();
    if (user) {
      if (user.role === 'admin') {
        el.innerHTML = `<span>👑 管理员 ${user.name}</span> <a href="#" class="vp-link" onclick="VPApp.logout()">退出</a>`;
      } else if (user.role === 'agent') {
        el.innerHTML = `<span>🛎️ ${user.name}</span> <a href="#" class="vp-link" onclick="VPApp.logout()">退出</a>`;
      } else {
        el.innerHTML = `<span>👤 ${user.name}</span> <a href="#" class="vp-link" onclick="VPApp.logout()">退出</a>`;
      }
    } else {
      el.innerHTML = `<a href="#" class="vp-link" onclick="VPApp.showLogin();return false">登录</a> | <a href="#" class="vp-link" onclick="VPApp.showRegister();return false">注册</a>`;
    }
  }

            <label>手机号：<input class="vp-input" id="vp-book-phone" placeholder="请输入手机号" value="${VPAuth.currentUser()?.phone || ''}"></label>
            <label>目标国家：<input class="vp-input" id="vp-book-country" placeholder="如：法国" value="${currentCountryId ? (VISAPILOT.VISA_CONFIG[currentCountryId]?.name || '') : ''}"></label>
            <label>签证类型：<input class="vp-input" id="vp-book-visa" placeholder="如：旅游签证" value="${currentVisaType || ''}"></label>
            <div class="vp-order-summary">
              <p>套餐：${p.name}</p>
              <p>金额：<strong>¥${p.price}</strong></p>
              <p class="vp-text-muted">客服将在30分钟内电话联系您</p>
            </div>
            <button class="vp-btn vp-btn-primary vp-btn-block vp-btn-lg" onclick="VPApp.submitBooking('${plan}')">立即下单（¥${p.price}）</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function submitBooking(plan) {
    const name = document.getElementById('vp-book-name')?.value.trim();
    const phone = document.getElementById('vp-book-phone')?.value.trim();
    const country = document.getElementById('vp-book-country')?.value.trim();
    const visaType = document.getElementById('vp-book-visa')?.value.trim();

    if (!name || !phone) { showToast('请填写姓名和手机号','warning'); return; }

    const plans = { diy:100, basic:299, full:399 };
    const price = plans[plan] || 100;

    const order = VPStorage.addOrder({
      userId: phone,
      userName: name,
      country,
      visaType,
      plan: plan,
      amount: price,
    });

    // 也添加为咨询记录
    VPStorage.addConsultation({
      name, phone,
      country,
      visaType,
      remark: `下单：${plan === 'diy' ? '线上审核' : '全程代办'} ¥${price}`,
    });

    document.querySelector('.vp-modal-overlay')?.remove();

    // 显示成功弹窗
    const successModal = document.createElement('div');
    successModal.className = 'vp-modal-overlay';
    successModal.innerHTML = `
      <div class="vp-modal">
        <div class="vp-modal-header">
          <h3>✅ 下单成功</h3>
        </div>
        <div class="vp-modal-body">
          <div class="vp-success-content">
            <div class="vp-success-icon">🎉</div>
            <p>您的订单已提交成功</p>
            <p>订单号：<strong>${order.id}</strong></p>
            <p>客服将在30分钟内电话联系您</p>
            <button class="vp-btn vp-btn-primary vp-btn-block" onclick="this.closest('.vp-modal-overlay').remove()">我知道了</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(successModal);
  }

  // ========= 管理后台登录 =========
  function showAdminLogin() {
    const modal = document.createElement('div');
    modal.className = 'vp-modal-overlay';
    modal.innerHTML = `
      <div class="vp-modal">
        <div class="vp-modal-header">
          <h3>🔐 后台管理登录</h3>
          <button class="vp-modal-close" onclick="this.closest('.vp-modal-overlay').remove()">✕</button>
        </div>
        <div class="vp-modal-body">
          <div class="vp-form">
            <label>管理员邮箱：<input class="vp-input" id="vp-admin-account" placeholder="admin@test.com"></label>
            <label>密码：<input class="vp-input" id="vp-admin-password" type="password" placeholder="visapilot123" value="visapilot123" onkeydown="if(event.key==='Enter')VPApp.doAdminLogin()"></label>
            <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doAdminLogin()">进入管理后台</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function doAdminLogin() {
    const account = document.getElementById('vp-admin-account')?.value.trim() || 'admin@test.com';
    const password = document.getElementById('vp-admin-password')?.value;
    const result = VPAuth.login(account, password || 'admin123');
    if (result.ok && result.user.role === 'admin') {
      document.querySelector('.vp-modal-overlay')?.remove();
      renderUserStatus();
      showAdminDashboard();
      showToast('✅ 管理员登录成功','success');
    } else if (result.ok) {
      showToast('❌ 此账号不是管理员','error');
    } else {
      showToast('❌ '+result.error,'error');
    }
  }

  // ========= 管理后台面板 =========
  function showAdminDashboard() {
    const main = document.getElementById('vp-main-content');
    if (!main) return;

    main.innerHTML = `
      <div class="vp-admin-dashboard">
        <h2>🔐 后台管理</h2>
        <!-- 数据概览 -->
        <div class="vp-stats-grid">
          <div class="vp-stat-card" style="border-left:4px solid #3b82f6">
            <div class="vp-stat-num">${VPStorage.getAllUsers().filter(u => u.role === 'user').length}</div>
            <div class="vp-stat-label">👤 注册用户</div>
          </div>
          <div class="vp-stat-card" style="border-left:4px solid #8b5cf6">
            <div class="vp-stat-num">${VPStorage.getAllUsers().filter(u => u.role === 'agent' && u.approved).length}</div>
            <div class="vp-stat-label">🛎️ 签证官</div>
          </div>
          <div class="vp-stat-card" style="border-left:4px solid #10b981">
            <div class="vp-stat-num">${VPStorage.getOrders().length}</div>
            <div class="vp-stat-label">📋 总订单</div>
          </div>
          <div class="vp-stat-card" style="border-left:4px solid #f59e0b">
            <div class="vp-stat-num">¥${VPStorage.getOrders().reduce((s,o) => s + (o.amount||0), 0)}</div>
            <div class="vp-stat-label">💰 总收入</div>
          </div>
        </div>
        <div class="vp-admin-tabs">
          <button class="vp-admin-tab active" onclick="VPUI.switchAdminTab(this,'users')">👥 用户管理</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAdminTab(this,'agent-reviews')">👤 代办审核</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAdminTab(this,'reviews')">📋 审核管理</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAdminTab(this,'allocation')">📋 分配</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAdminTab(this,'conversations')">💬 用户对话</button>
        </div>
        <div id="vp-admin-content">
          <div id="vp-admin-users">加载中...</div>
        </div>
      </div>
    `;

    VPAdmin.init();
  }

  // ========= 代办工作台 =========
  function showAgentLogin() {
    const modal = document.createElement('div');
    modal.className = 'vp-modal-overlay';
    modal.innerHTML = `
      <div class="vp-modal">
        <div class="vp-modal-header">
          <h3>🛎️ 签证官登录</h3>
          <button class="vp-modal-close" onclick="this.closest('.vp-modal-overlay').remove()">✕</button>
        </div>
        <div class="vp-modal-body">
          <div class="vp-form">
            <label>邮箱：<input class="vp-input" id="vp-agent-login-phone" placeholder="officer@test.com" value="officer@test.com"></label>
            <label>密码：<input class="vp-input" id="vp-agent-login-password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')VPApp.doAgentLogin()"></label>
            <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doAgentLogin()">登录</button>
            <p class="vp-form-footer">还没有账号？<a href="#" onclick="VPApp.showRegister();return false">注册签证官</a></p>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }

  function doAgentLogin() {
    const phone = document.getElementById('vp-agent-login-phone')?.value.trim();
    const password = document.getElementById('vp-agent-login-password')?.value;
    if (!phone || !password) { showToast('请填写邮箱/手机号和密码','warning'); return; }

    const result = VPAuth.login(phone, password);
    if (result.ok && result.user.role === 'agent') {
      document.querySelector('.vp-modal-overlay')?.remove();
      renderUserStatus();
      showAgentDashboard();
      showToast('✅ 登录成功','success');
    } else if (result.ok && result.user.role !== 'agent') {
      showToast('❌ 此账号不是签证官账号','error');
    } else {
      showToast('❌ ' + result.error,'error');
    }
  }

  function showAgentDashboard() {
    const main = document.getElementById('vp-main-content');
    if (!main) return;

    main.innerHTML = `
      <div class="vp-admin-dashboard">
        <h2>🛎️ 代办工作台</h2>
        <div class="vp-agent-stats-row">
          <div class="vp-agent-stat"><strong>${VPStorage.getOrders().filter(o => o.status === 'pending').length}</strong><span>待接单</span></div>
          <div class="vp-agent-stat"><strong>${VPStorage.getOrders().filter(o => o.assignedTo === agentPhone).length}</strong><span>已接单</span></div>
          <div class="vp-agent-stat"><strong>${VPStorage.getMessages('agent_'+agentPhone).length || VPStorage.getAllConversations()['agent_'+agentPhone]?.length || 0}+</strong><span>对话数</span></div>
        </div>
        <div class="vp-admin-tabs">
          <button class="vp-admin-tab active" onclick="VPUI.switchAgentTab(this,'orders')">📋 订单面板</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAgentTab(this,'reviews')">📋 材料审核</button>
          <button class="vp-admin-tab" onclick="VPUI.switchAgentTab(this,'chat')">💬 用户对话</button>
        </div>
        <div id="vp-agent-content">
          <div id="vp-agent-orders">加载中...</div>
        </div>
      </div>
    `;

    VPAgent.init();
  }

  // ========= 我的预约页 =========
  function esc(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  function saveProfile() {
    var name = document.getElementById('vp-pro-name')?.value.trim();
    var phone = document.getElementById('vp-pro-phone')?.value.trim();
    var wechat = document.getElementById('vp-pro-wechat')?.value.trim();
    var pwd = document.getElementById('vp-pro-pwd')?.value;
    if (!name) { showToast('姓名不能为空','warning'); return; }
    var user = VPAuth.currentUser();
    if (user) {
      user.name = name;
      user.phone = phone;
      user.wechat = wechat;
      if (pwd && pwd.length >= 6) user.password = pwd;
      VPStorage.saveUser(user);
      renderUserStatus();
      showToast('✅ 信息已保存','success');
    }
  }

  function showMyBookings() {
    if (!VPAuth.currentUser()) {
      showLogin();
      return;
    }
    VPUI.renderMyBookings();
  }

  function showProfile() {
    VPUI.renderProfile();
  }

  // ========= Toast 通知 =========
  function showToast(msg, type) {
    let container = document.getElementById('vp-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'vp-toast-container';
      container.style.cssText = 'position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = `vp-toast vp-toast-${type || 'info'}`;
    toast.textContent = msg;
    toast.style.cssText = `
      padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,0.12);
      animation: slideIn .3s ease;max-width:360px;
      background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : type === 'warning' ? '#f59e0b' : '#6366f1'};
      color: white;
    `;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // ========= 管理员标签切换 =========
  function switchAdminTab(btn, tab) {
    document.querySelectorAll('.vp-admin-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    // clear previous content and set the right ID
    const content = document.getElementById('vp-admin-content');
    const views = {
      'users': '<div id="vp-admin-users"></div>',
      'agent-reviews': '<div id="vp-admin-agent-reviews"></div>',
      'reviews': '<div id="vp-admin-reviews"></div>',
      'allocation': '<div id="vp-admin-allocation"></div>',
      'conversations': '<div id="vp-admin-conversations"></div>',
    };
    if (content) {
      content.innerHTML = views[tab] || views['users'];
    }

    switch (tab) {
      case 'users': VPAdmin.renderUsers(); break;
      case 'agent-reviews': VPAdmin.renderAgentReviews(); break;
      case 'reviews': VPAdmin.renderReviewMgmt(); break;
      case 'allocation': VPAdmin.renderAllocation(); break;
      case 'conversations': VPAdmin.renderConversations(); break;
    }
  }

  function switchAgentTab(btn, tab) {
    document.querySelectorAll('.vp-admin-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    const content = document.getElementById('vp-agent-content');
    const views = {
      'orders': '<div id="vp-agent-orders"></div>',
      'reviews': '<div id="vp-agent-reviews"></div>',
      'chat': '<div id="vp-agent-conversations"></div>',
    };
    if (content) {
      content.innerHTML = views[tab] || views['orders'];
    }

    switch (tab) {
      case 'orders': VPAgent.renderOrders(); break;
      case 'reviews': VPAgent.renderMaterialReviews(); break;
      case 'chat': VPAgent.renderAgentConversations(); break;
    }
  }

  // ========= 登录/注册标签切换（UI helper that we expose） =========
  function switchLoginTab(btn, role) {
    document.querySelectorAll('.vp-login-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    loginRole = role;

    const area = document.getElementById('vp-login-form-area');
    if (area) {
      area.innerHTML = `
        <div class="vp-form">
          <label>邮箱/手机号：<input class="vp-input" id="vp-login-phone" placeholder="user@test.com 或手机号"></label>
          <label>密码：<input class="vp-input" id="vp-login-password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')VPApp.doLogin()"></label>
          <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doLogin()">登录</button>
          <p class="vp-form-footer">还没有账号？<a href="#" onclick="VPApp.showRegister();return false">立即注册</a></p>
        </div>
      `;
    }
  }

  function switchRegTab(btn, role) {
    document.querySelectorAll('.vp-login-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    window._regRole = role;

    const area = document.getElementById('vp-reg-form-area');
    if (area) {
      let extraFields = '';
      if (role === 'agent') {
        extraFields = `
          <div class="vp-agent-fields">
            <label>姓名/机构名称：<input class="vp-input" id="vp-reg-agent-org" placeholder="姓名或机构名称"></label>
            <label>从业经验（年）：<input class="vp-input" id="vp-reg-agent-years" type="number" placeholder="如：3"></label>
            <label>个人简介：<textarea class="vp-input" id="vp-reg-agent-bio" rows="3" placeholder="介绍您的签证代办经验..."></textarea></label>
          </div>
          <p class="vp-text-muted" style="font-size:0.85em">平台抽取订单金额 30% 作为服务费</p>
        `;
      }

      area.innerHTML = `
        <div class="vp-form">
          <label>姓名：<input class="vp-input" id="vp-reg-name" placeholder="请输入姓名"></label>
          <label>邮箱：<input class="vp-input" id="vp-reg-email" type="email" placeholder="user@example.com"></label>
          <label>手机号：<input class="vp-input" id="vp-reg-phone" placeholder="请输入手机号"></label>
          <label>微信号：<input class="vp-input" id="vp-reg-wechat" placeholder="请输入微信号（选填）"></label>
          <label>密码：<input class="vp-input" id="vp-reg-password" type="password" placeholder="请设置密码（至少6位）"></label>
          ${extraFields}
          <button class="vp-btn vp-btn-primary vp-btn-block" onclick="VPApp.doRegister()">${role === 'agent' ? '提交审核' : '注册'}</button>
          <p class="vp-form-footer">已有账号？<a href="#" onclick="VPApp.showLogin();return false">立即登录</a></p>
        </div>
      `;
    }
  }

  // Public API
  return {
    init,
    navigateToCountry,
    switchVisaType,
    showLogin,
    doLogin,
    showRegister,
    doRegister,
    logout,
    showAdminLogin,
    doAdminLogin,
    showAdminDashboard,
    showAgentLogin,
    doAgentLogin,
    showAgentDashboard,
    openBooking,
    submitBooking,
    showMyBookings,
    showProfile,
    showConsultForm: VPUI.showConsultForm,
    showToast,
    switchAdminTab,
    switchAgentTab,
    switchLoginTab,
    switchRegTab,
    get currentCountry() { return currentCountryId; },
    set currentCountry(v) { currentCountryId = v; },
    get currentVisaType() { return currentVisaType; },
    set currentVisaType(v) { currentVisaType = v; },
  };
})();

// 页面加载后初始化
document.addEventListener('DOMContentLoaded', VPApp.init);



</script>
